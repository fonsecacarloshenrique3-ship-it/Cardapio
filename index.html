<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio & Pedidos</title>

  <meta name="description" content="Cardápio digital simples para seleção de pedidos com cálculo de preço.">
  <meta name="theme-color" content="#1c96a0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cardápio">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍔 Cardápio & Pedidos</h1>
    <p class="subtitulo">Clique nos itens para selecionar seu pedido</p>
  </header>

  <main>
    <!-- Adicionar Novo Item com Preço -->
    <div class="novo-item">
      <input id="campo" type="text" placeholder="Nome do item (ex: X-Burger)">
      <input id="campo-preco" type="number" step="0.50" min="0" placeholder="R$ Preço">
      <button id="botao">Adicionar</button>
    </div>

    <!-- Contador e Total do Pedido -->
    <div class="resumo-container">
      <p id="contador">0 itens selecionados</p>
      <p id="total-pedido" class="total-destaque">Total: R$ 0,00</p>
    </div>

    <!-- Lista de Itens do Cardápio -->
    <ul id="lista"></ul>

    <!-- Ações: Limpar Seleção e Enviar Pedido -->
    <div class="botoes-acao">
      <button id="btn-limpar" class="btn-limpar">Limpar Selecionados</button>
      <button id="btn-pedir" class="btn-pedir">📲 Enviar Pedido via WhatsApp</button>
    </div>
  </main>

  <!-- Service Worker para PWA (Aula 03) -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => console.log("Service Worker registrado com sucesso!"))
        .catch(err => console.error("Erro ao registrar Service Worker:", err));
    }
  </script>

  <script src="app.js"></script>
</body>
</html>
