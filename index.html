<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Tarefas 2.0</title>

  <meta name="description" content="App simples de tarefas.">
  <meta name="theme-color" content="#1c96a0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tarefas">

  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📝 Minhas Tarefas</h1>
  </header>

  <main>
    <div class="nova-tarefa">
      <input id="campo" type="text" placeholder="O que você precisa fazer?">
      <button id="botao">Adicionar</button>
    </div>

    <p class="contador-container" id="contador">0 concluídas</p>

    <ul id="lista"></ul>

    <button id="btn-limpar" class="btn-limpar">Limpar concluídas</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
